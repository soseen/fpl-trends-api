/home/deploy/.pm2/logs/*.log {
    daily
    size 10M
    rotate 7
    compress
    missingok
    notifempty
    copytruncate
    su deploy deploy
}

/home/deploy/populate-managers.log /home/deploy/refresh-footballers.log /home/deploy/refresh-rank-curve.log /home/deploy/analytics-monitor.log {
    daily
    size 10M
    rotate 7
    compress
    missingok
    notifempty
    copytruncate
    su deploy deploy
}
